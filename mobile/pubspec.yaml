name: fitness_diary
description: Local-first nutrition diary development build.
publish_to: none
version: 2.0.0-dev+3
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  sqflite: ^2.4.0
  path: ^1.9.0
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  sqflite_common_ffi_web: ^1.2.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
