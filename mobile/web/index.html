<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <style>html,body{margin:0;background:#10121B;color:#F1F2FA} @media(prefers-color-scheme:light){html,body{background:#F7F8FC;color:#10121B}}</style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FLEX nutrition diary. Log meals, water, weight and exercise in your browser.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FLEX">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="flex.svg"/>

  <title>FLEX · Nutrition diary</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <noscript>FLEX needs JavaScript to open your local nutrition diary.</noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.

</html>
